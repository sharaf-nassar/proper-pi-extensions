name: Publish npm package

on:
  push:
    tags:
      - "proper-base-v*"
      - "proper-flow-v*"
      - "proper-llm-router-v*"
      - "proper-pacify-v*"

permissions: {}

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}
      package: ${{ steps.meta.outputs.package }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify annotated tag and main ancestry
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          test "$(git cat-file -t "refs/tags/${TAG_NAME}")" = "tag"
          test "$(git rev-parse "refs/tags/${TAG_NAME}^{commit}")" = "$TAG_SHA"
          git fetch origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$TAG_SHA" "origin/$DEFAULT_BRANCH"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install trusted-publishing npm version
        run: npm install --global npm@11.19.0

      - name: Resolve configured package
        id: meta
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const config = JSON.parse(fs.readFileSync(".release-me.json", "utf8"));
          if (config.type !== "npm" || !config.packages || typeof config.packages !== "object") {
            throw new Error("Invalid .release-me.json npm package configuration");
          }
          if (config.branch !== process.env.DEFAULT_BRANCH) {
            throw new Error(`Configured release branch ${config.branch} is not ${process.env.DEFAULT_BRANCH}`);
          }

          const match = /^(proper-base|proper-flow|proper-llm-router|proper-pacify)-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$/.exec(process.env.TAG_NAME);
          if (!match) throw new Error(`Unsupported npm release tag: ${process.env.TAG_NAME}`);

          const packageName = match[1];
          const version = match[2];
          const manifestPath = config.packages[packageName];
          if (typeof manifestPath !== "string" || path.isAbsolute(manifestPath)) {
            throw new Error(`Invalid manifest path for ${packageName}`);
          }

          const absoluteManifest = path.resolve(manifestPath);
          const relativeManifest = path.relative(process.cwd(), absoluteManifest);
          if (!relativeManifest || relativeManifest.startsWith(`..${path.sep}`)) {
            throw new Error(`Manifest escapes repository: ${manifestPath}`);
          }

          const manifest = JSON.parse(fs.readFileSync(absoluteManifest, "utf8"));
          if (manifest.name !== packageName || manifest.version !== version || manifest.private) {
            throw new Error(`Tag ${process.env.TAG_NAME} does not match ${manifest.name}@${manifest.version}`);
          }

          const packagePath = path.dirname(relativeManifest).split(path.sep).join("/");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `package=${packageName}\npath=${packagePath}\nversion=${version}\n`);
          NODE

      - name: Install package dependencies without lifecycle scripts
        env:
          PACKAGE_PATH: ${{ steps.meta.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$PACKAGE_PATH/package-lock.json" ]]; then
            npm ci --prefix "$PACKAGE_PATH" --ignore-scripts
          fi

      - name: Build verified package tarball
        id: pack
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package }}
          PACKAGE_PATH: ${{ steps.meta.outputs.path }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/npm-release"
          mkdir -p "$artifact_dir"
          npm pack "./$PACKAGE_PATH" --pack-destination "$artifact_dir" --json > "$artifact_dir/pack.json"
          test -z "$(git status --porcelain)"

          ARTIFACT_DIR="$artifact_dir" node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const dir = process.env.ARTIFACT_DIR;
          const tarballs = fs.readdirSync(dir).filter((name) => name.endsWith(".tgz"));
          if (tarballs.length !== 1) throw new Error(`Expected one tarball, found ${tarballs.length}`);
          const filename = tarballs[0];
          const bytes = fs.readFileSync(path.join(dir, filename));
          const integrity = `sha512-${crypto.createHash("sha512").update(bytes).digest("base64")}`;
          const manifest = {
            package: process.env.PACKAGE_NAME,
            version: process.env.PACKAGE_VERSION,
            tag: process.env.TAG_NAME,
            sha: process.env.TAG_SHA,
            filename,
            integrity,
          };
          fs.writeFileSync(path.join(dir, "release-manifest.json"), `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          artifact="npm-${PACKAGE_NAME}-${PACKAGE_VERSION}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "path=$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Upload verified tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install trusted-publishing npm version
        run: npm install --global npm@11.19.0

      - name: Download verified tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: dist

      - name: Verify and publish tarball
        env:
          EXPECTED_PACKAGE: ${{ needs.verify.outputs.package }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node > "$RUNNER_TEMP/artifact-meta" <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const manifest = JSON.parse(fs.readFileSync("dist/release-manifest.json", "utf8"));
          for (const [field, expected] of Object.entries({
            package: process.env.EXPECTED_PACKAGE,
            version: process.env.EXPECTED_VERSION,
            tag: process.env.EXPECTED_TAG,
            sha: process.env.EXPECTED_SHA,
          })) {
            if (manifest[field] !== expected) throw new Error(`Artifact ${field} mismatch`);
          }
          if (path.basename(manifest.filename) !== manifest.filename || !manifest.filename.endsWith(".tgz")) {
            throw new Error("Invalid artifact filename");
          }
          const tarball = path.join("dist", manifest.filename);
          const bytes = fs.readFileSync(tarball);
          const integrity = `sha512-${crypto.createHash("sha512").update(bytes).digest("base64")}`;
          if (integrity !== manifest.integrity) throw new Error("Artifact integrity mismatch");
          process.stdout.write(`${tarball}\n${integrity}\n`);
          NODE
          mapfile -t artifact < "$RUNNER_TEMP/artifact-meta"
          TARBALL=${artifact[0]}
          EXPECTED_INTEGRITY=${artifact[1]}

          tar -xOf "$TARBALL" package/package.json > "$RUNNER_TEMP/package.json"
          node <<'NODE'
          const manifest = require(process.env.RUNNER_TEMP + "/package.json");
          if (manifest.name !== process.env.EXPECTED_PACKAGE || manifest.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`Tarball contains ${manifest.name}@${manifest.version}`);
          }
          NODE

          view_status=0
          view_output=$(npm view "${EXPECTED_PACKAGE}@${EXPECTED_VERSION}" dist.integrity --json 2>&1) || view_status=$?
          if ((view_status == 0)); then
            published_integrity=${view_output#\"}
            published_integrity=${published_integrity%\"}
            test "$published_integrity" = "$EXPECTED_INTEGRITY"
            echo "${EXPECTED_PACKAGE}@${EXPECTED_VERSION} is already published with this tarball."
          elif [[ "$view_output" == *"E404"* ]]; then
            npm publish "$PWD/$TARBALL" --access public
          else
            echo "$view_output" >&2
            exit "$view_status"
          fi

  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub Release from annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_NAME: ${{ needs.verify.outputs.package }}
          PACKAGE_VERSION: ${{ needs.verify.outputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}"
          test "$(git cat-file -t "refs/tags/${TAG_NAME}")" = "tag"
          notes_file="$RUNNER_TEMP/release-notes.md"
          git tag -l --format='%(contents)' "$TAG_NAME" > "$notes_file"
          test -s "$notes_file"

          if gh release view "$TAG_NAME" --repo "$GH_REPO" > /dev/null 2>&1; then
            echo "GitHub Release $TAG_NAME already exists."
          else
            gh release create "$TAG_NAME" \
              --repo "$GH_REPO" \
              --verify-tag \
              --title "$PACKAGE_NAME v$PACKAGE_VERSION" \
              --notes-file "$notes_file" \
              --latest=false
          fi
